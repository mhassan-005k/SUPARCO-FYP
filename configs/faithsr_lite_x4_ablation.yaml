seed: 0
scale: 4
model:
  channels: 32
  num_blocks: 6
  embed_dim: 48
  kernel_size: 7
  max_consistency_strength: 0.20
data:
  crop_size: 192
  train_ratio: 0.5
  split_grid_degrees: 0.1
  extensions: [".tif", ".tiff"]
  mixed_probability: 0.75
  compression_focus_probability: 0.50
  compression_focus_floor: 0.80
degradation:
  curriculum_epochs: 15
  start_severity: 0.20
  mtf_probability: 0.50
training:
  epochs: 60
  batch_size: 8
  validation_batch_size: 16
  teacher_batch_size: 2
  workers: 2
  learning_rate: 0.0002
  weight_decay: 0.0001
  amp: true
loss:
  charbonnier: 1.0
  ssim: 0.10
  gradient: 0.03
  frequency: 0.02
  observation: 0.05
  degradation: 0.02
  distillation: 0.05
  distillation_edge: 0.01
  compression_focus: 1.0
inference:
  tile_size: 512
  overlap: 32

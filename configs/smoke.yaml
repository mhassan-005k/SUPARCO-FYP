seed: 42
scale: 3
model:
  channels: 8
  num_blocks: 1
  embed_dim: 8
  kernel_size: 3
  use_degradation_adaptation: true
  use_observation_consistency: true
  use_uncertainty: true
data:
  crop_size: 48
  train_ratio: 0.5
  mixed_probability: 1.0
  extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
training:
  epochs: 1
  batch_size: 1
  validation_batch_size: 1
  workers: 0
  learning_rate: 0.0002
  weight_decay: 0.0001
  amp: false
loss:
  charbonnier: 1.0
  ssim: 0.10
  gradient: 0.03
  frequency: 0.02
  observation: 0.05
  degradation: 0.02
  uncertainty: 0.02
  distillation: 0.0
inference:
  tile_size: 64
  overlap: 8
